services:
  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      JURYSTACK_DATABASE_URL: postgresql+asyncpg://jurystack:jurystack@db:5432/jurystack
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    image: postgres:17.4-alpine3.21
    environment:
      POSTGRES_DB: jurystack
      POSTGRES_USER: jurystack
      POSTGRES_PASSWORD: jurystack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurystack -d jurystack"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
