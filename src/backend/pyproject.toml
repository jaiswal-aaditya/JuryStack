[project]
name = "jurystack-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5,<2",
    "asyncpg>=0.30.0,<1",
    "fastapi>=0.116.1,<1",
    "pwdlib[argon2]>=0.2.1,<1",
    "pydantic-settings>=2.10.1,<3",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["../../tests/backend"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
